stages: [check, package]

.api_postgres:
  image: mcr.microsoft.com/dotnet/sdk:10.0.201-noble
  services:
    - name: postgres:17-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
      alias: postgres
  variables:
    GIT_STRATEGY: clone
    FF_NETWORK_PER_BUILD: "true"
    POSTGRES_DB: guardian_ci
    POSTGRES_USER: guardian_ci
    POSTGRES_PASSWORD: guardian-ci-disposable

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

verify:
  stage: check
  image: mcr.microsoft.com/dotnet/sdk:10.0.201-noble
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'
  script:
    - dotnet --info
    - dotnet restore Guardian.slnx --locked-mode
    - dotnet build Guardian.slnx -c Release --no-restore -warnaserror
    - dotnet format Guardian.slnx --verify-no-changes --no-restore
    - dotnet test Guardian.slnx -c Release --no-build --logger trx --collect "XPlat Code Coverage" --results-directory artifacts/tests
    - dotnet publish src/Guardian.Cli -c Release --no-build -o artifacts/guardian
    - pwsh -NoProfile -File scripts/verify-cli.ps1
    - pwsh -NoProfile -Command '$engine = & ./scripts/install-oasdiff.ps1; & ./scripts/probe-oasdiff.ps1 -Engine $engine; & ./scripts/verify-contracts.ps1 -Engine $engine; & ./scripts/verify-policy.ps1 -Engine $engine'
  artifacts:
    when: always
    paths:
      - artifacts/tests/
      - artifacts/guardian/
      - artifacts/oasdiff/
      - artifacts/contract-tests/results/
      - artifacts/policy-tests/*/report.json
      - artifacts/policy-tests/*/report.md

api_integration:
  extends: .api_postgres
  stage: check
  rules:
    - exists:
        - tests/Guardian.Api.IntegrationTests/Guardian.Api.IntegrationTests.csproj
  script:
    - export "GUARDIAN_TEST_POSTGRES=Host=postgres;Database=$POSTGRES_DB;Username=$POSTGRES_USER;Password=$POSTGRES_PASSWORD"
    - dotnet restore tests/Guardian.Api.IntegrationTests --locked-mode
    - dotnet test tests/Guardian.Api.IntegrationTests -c Release --no-restore --logger trx --results-directory artifacts/api-tests
  artifacts:
    when: always
    paths: [artifacts/api-tests/]

publish_reports:
  extends: .api_postgres
  stage: package
  needs:
    - job: verify
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      exists:
        - scripts/verify-publish.sh
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends postgresql-client
    - dotnet restore src/Guardian.Api --locked-mode
    - dotnet build src/Guardian.Api -c Release --no-restore -warnaserror
    - PGHOST=postgres PGDATABASE="$POSTGRES_DB" PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" sh scripts/verify-publish.sh
  artifacts:
    when: always
    paths: [artifacts/publish-acceptance/]

web_check:
  stage: check
  image: node:24.11.0-alpine
  rules:
    - exists: [web/package-lock.json]
  script:
    - cd web
    - npm ci
    - npm run lint
    - npm run typecheck
    - npm run build

publish_cli:
  stage: package
  image:
    name: moby/buildkit:v0.35.1-rootless@sha256:7d02292556e66feea6d2d89b7ec143503b57e4f59a4efc6b7ece8547e4d3e5be
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Dockerfile
        - .dockerignore
        - global.json
        - Directory.Build.props
        - scripts/install-oasdiff.ps1
        - scripts/check-merge-request.sh
        - scripts/publish-cli.sh
        - src/**/*
  script:
    - sh scripts/publish-cli.sh
  artifacts:
    paths: [artifacts/image-metadata.json]

api_contract_guard:
  stage: check
  image:
    name: registry.gitlab.com/hung-it/api_contract_guardian/guardian-cli@sha256:30d3f9ac53c5a2326e0b4aca3fee046ca708033a0e8a8f74026967af6a9a691d
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "detached" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "demo/week3-missing-baseline")'
  script:
    - sh /app/check-merge-request.sh
  artifacts:
    when: always
    paths: [reports/]
    expire_in: 14 days
