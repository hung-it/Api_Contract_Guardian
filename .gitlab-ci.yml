stages: [check, package]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

verify:
  stage: check
  image: mcr.microsoft.com/dotnet/sdk:10.0.201-noble
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'
  script:
    - dotnet --info
    - dotnet restore Guardian.slnx --locked-mode
    - dotnet build Guardian.slnx -c Release --no-restore -warnaserror
    - dotnet format Guardian.slnx --verify-no-changes --no-restore
    - dotnet test Guardian.slnx -c Release --no-build --logger trx --collect "XPlat Code Coverage" --results-directory artifacts/tests
    - dotnet publish src/Guardian.Cli -c Release --no-build -o artifacts/guardian
    - pwsh -NoProfile -File scripts/verify-cli.ps1
    - pwsh -NoProfile -Command '$engine = & ./scripts/install-oasdiff.ps1; & ./scripts/probe-oasdiff.ps1 -Engine $engine; & ./scripts/verify-contracts.ps1 -Engine $engine; & ./scripts/verify-policy.ps1 -Engine $engine'
  artifacts:
    when: always
    paths:
      - artifacts/tests/
      - artifacts/guardian/
      - artifacts/oasdiff/
      - artifacts/contract-tests/results/
      - artifacts/policy-tests/*/report.json
      - artifacts/policy-tests/*/report.md

publish_cli:
  stage: package
  image:
    name: moby/buildkit:v0.35.1-rootless@sha256:7d02292556e66feea6d2d89b7ec143503b57e4f59a4efc6b7ece8547e4d3e5be
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - Dockerfile
        - .dockerignore
        - global.json
        - Directory.Build.props
        - scripts/install-oasdiff.ps1
        - scripts/check-merge-request.sh
        - scripts/publish-cli.sh
        - src/**/*
  script:
    - sh scripts/publish-cli.sh
  artifacts:
    paths: [artifacts/image-metadata.json]

api_contract_guard:
  stage: check
  image:
    name: registry.gitlab.com/hung-it/api_contract_guardian/guardian-cli@sha256:30d3f9ac53c5a2326e0b4aca3fee046ca708033a0e8a8f74026967af6a9a691d
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "detached" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "demo/week3-missing-baseline")'
  script:
    - sh /app/check-merge-request.sh
  artifacts:
    when: always
    paths: [reports/]
    expire_in: 14 days
