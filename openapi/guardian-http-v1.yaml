openapi: 3.1.0
info:
  title: Guardian Report Store
  version: 1.0.0
  description: Project-scoped ingestion and reviewer access to Guardian reports.
servers:
  - url: http://127.0.0.1:5186
paths:
  /api/v1/projects/{projectId}/ci-reports:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: publishReport
      security: [{ ReportToken: [] }]
      externalDocs:
        description: Guardian JSON report schema v1
        url: https://github.com/hung-it/Api_Contract_Guardian/blob/main/schemas/report-v1.schema.json
      requestBody:
        required: true
        description: Report v1 JSON document, up to 10 MiB. All verdicts can be stored.
        content:
          application/json:
            schema:
              type: object
              required: [schema_version, status, summary, provenance, findings, diagnostics]
              properties:
                schema_version: { const: '1.0' }
                status: { $ref: '#/components/schemas/Verdict' }
      responses:
        '201': { $ref: '#/components/responses/Published' }
        '200': { $ref: '#/components/responses/Published' }
        '400': { description: Invalid JSON }
        '401': { description: Missing, invalid, expired or revoked token }
        '403': { description: Token lacks permission for this project }
        '409': { description: Different content for an existing analysis key }
        '413': { description: Report exceeds the byte limit }
        '415': { description: Expected a JSON media type }
        '422': { description: Schema validation or persistence validation failed }
  /api/v1/auth/csrf:
    get:
      operationId: issueCsrf
      responses:
        '200':
          description: Antiforgery cookie and request token. Obtain a fresh token after signing in.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
  /api/v1/auth/login:
    post:
      operationId: signIn
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 256, format: password }
      responses:
        '204': { description: Session cookie issued }
        '400': { description: Credentials or antiforgery request malformed }
        '401': { description: Credentials rejected }
  /api/v1/auth/logout:
    post:
      operationId: signOut
      security: [{ ReviewerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: Session cookie cleared }
        '400': { description: Antiforgery validation failed }
        '401': { $ref: '#/components/responses/SignInRequired' }
  /api/v1/projects:
    get:
      operationId: listProjects
      security: [{ ReviewerSession: [] }]
      responses:
        '200':
          description: Projects assigned to the signed-in reviewer
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, role]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    role: { type: string, enum: [Viewer, Developer, Maintainer] }
        '401': { $ref: '#/components/responses/SignInRequired' }
  /api/v1/projects/{projectId}/analyses:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getHistory
      security: [{ ReviewerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Analyses ordered latest first. Use next_cursor for the next page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Analysis' } }
                  next_cursor: { type: [string, 'null'] }
        '400': { description: Invalid cursor or page size }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/v1/analyses/{analysisId}:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      operationId: getAnalysis
      security: [{ ReviewerSession: [] }]
      responses:
        '200':
          description: Analysis metadata, report totals, diagnostics and source provenance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Analysis'
                  - type: object
                    required: [project_id, summary, provenance, diagnostics]
                    properties:
                      project_id: { type: string, format: uuid }
                      summary: { type: object }
                      provenance: { type: object }
                      diagnostics: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/v1/analyses/{analysisId}/findings:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      operationId: getFindings
      security: [{ ReviewerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
        - name: severity
          in: query
          schema: { type: string, enum: [ERR, WARN, INFO, UNKNOWN] }
        - name: rule
          in: query
          description: Exact rule ID
          schema: { type: string }
      responses:
        '200':
          description: Report v1 findings. Use next_after for the next page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after]
                properties:
                  items: { type: array, items: { type: object } }
                  next_after: { type: [integer, 'null'] }
        '400': { description: Invalid filter or page size }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/v1/projects/{projectId}/tokens:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listTokens
      security: [{ ReviewerSession: [] }]
      responses:
        '200':
          description: Token metadata for maintainers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TokenMetadata' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/MaintainerRequired' }
        '404': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createToken
      security: [{ ReviewerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days: { type: integer, minimum: 1, maximum: 30, default: 1 }
      responses:
        '201':
          description: Write token created. The secret appears in this response once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenMetadata'
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, pattern: '^[0-9a-f]{64}$' }
        '400': { description: Invalid lifetime or antiforgery token }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/MaintainerRequired' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/v1/projects/{projectId}/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: tokenId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeToken
      security: [{ ReviewerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: Token revoked or already revoked }
        '400': { description: Antiforgery validation failed }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/MaintainerRequired' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /api/v1/projects/{projectId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getAuditEvents
      security: [{ ReviewerSession: [] }]
      responses:
        '200':
          description: Up to 100 recent events for this project, including actor and entity IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, project_id, actor_id, actor_kind, action, entity_id, created_at]
                  properties:
                    id: { type: string, format: uuid }
                    project_id: { type: string, format: uuid }
                    actor_id: { type: [string, 'null'], format: uuid }
                    actor_kind: { type: string }
                    action: { type: string, enum: [token.created, token.revoked, analysis.published] }
                    entity_id: { type: string, format: uuid }
                    created_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '403': { $ref: '#/components/responses/MaintainerRequired' }
        '404': { $ref: '#/components/responses/Unavailable' }
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200': { description: API process is serving HTTP }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200': { description: API can connect to PostgreSQL }
        '503': { description: PostgreSQL is unavailable }
components:
  securitySchemes:
    ReportToken: { type: http, scheme: bearer }
    ReviewerSession: { type: apiKey, in: cookie, name: guardian.session }
  parameters:
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    AnalysisId: { name: analysisId, in: path, required: true, schema: { type: string, format: uuid } }
    Csrf: { name: X-CSRF-TOKEN, in: header, required: true, schema: { type: string } }
    PageSize: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    SignInRequired: { description: Reviewer session required }
    MaintainerRequired: { description: Project Maintainer role required }
    Unavailable: { description: Resource absent or outside the visible project }
    Published:
      description: Analysis accepted, or the existing analysis returned for an idempotent replay
      content:
        application/json:
          schema:
            type: object
            required: [analysis_id, status, created_at]
            properties:
              analysis_id: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/Verdict' }
              created_at: { type: string, format: date-time }
  schemas:
    Verdict: { type: string, enum: [PASS, FAIL, INDETERMINATE] }
    Analysis:
      type: object
      required: [id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/Verdict' }
        created_at: { type: string, format: date-time }
    TokenMetadata:
      type: object
      required: [id, scope, expires_at]
      properties:
        id: { type: string, format: uuid }
        scope: { const: 'reports:write' }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
